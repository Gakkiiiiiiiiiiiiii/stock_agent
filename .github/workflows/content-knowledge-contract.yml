name: content-knowledge-contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stock_content_compat_sha:
        description: Exact approved stock_content commit SHA
        required: true
        type: string

jobs:
  content-knowledge-contract:
    runs-on: ubuntu-latest
    env:
      STOCK_CONTENT_COMPAT_SHA: ${{ inputs.stock_content_compat_sha || vars.STOCK_CONTENT_COMPAT_SHA }}
      STOCK_CONTENT_REPOSITORY: ${{ vars.STOCK_CONTENT_REPOSITORY }}
      CONTENT_KNOWLEDGE_CHECKSUM: sha256:A22A066A6B440606DC46059E4F63363C6D338C5A39C2005EE11FD7058EA9904F
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Require an exact approved Content commit
        run: |
          test -n "$STOCK_CONTENT_REPOSITORY"
          printf '%s' "$STOCK_CONTENT_COMPAT_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.STOCK_CONTENT_REPOSITORY }}
          ref: ${{ env.STOCK_CONTENT_COMPAT_SHA }}
          path: stock_content
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e ".[test]"
      - name: Verify only the Content knowledge boundary
        run: >-
          python scripts/contracts/verify_content_knowledge_bundle.py
          --producer-root stock_content
          --expected-producer-sha "$STOCK_CONTENT_COMPAT_SHA"
          --expected-checksum "$CONTENT_KNOWLEDGE_CHECKSUM"
          --consumer-sha "$GITHUB_SHA"
          --strict-ref
          --report content-knowledge-compatibility-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-knowledge-compatibility-${{ github.sha }}
          path: content-knowledge-compatibility-report.json
          if-no-files-found: error
