name: unit-tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: |
          pytest -q \
            tests/test_factor_fitness.py \
            tests/test_factor_walkforward.py \
            tests/test_factor_miner.py \
            tests/test_factor_paper_worker.py \
            tests/test_job_system.py \
            tests/test_regime.py \
            tests/test_api.py \
            tests/test_factor_lookback.py
