name: unit-tests

on:
  push:
  pull_request:
  # §14 真实 gate 不适合每个 PR 跑，改为手动 / nightly 触发
  workflow_dispatch:
  schedule:
    # nightly 03:00 CST（19:00 UTC 前一天）
    - cron: "0 19 * * *"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint skill contracts
        run: python scripts/check_skill_contracts.py
      - name: Check runtime artifacts are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.pytest_tmp[^/]*/|(^|/)\.coverage$|storage/runtime/.*\.(jsonl|log)$'; then
            echo "runtime artifacts are tracked"
            exit 1
          fi
      - name: Collect
        run: |
          pytest --collect-only -q \
            -m "not integration and not media and not qmt and not slow"
      - name: Test
        run: |
          pytest -q \
            -m "not integration and not media and not qmt and not slow" \
            --cov=engines.market \
            --cov=engines.backtest \
            --cov-report=term-missing \
            --cov-fail-under=70

  architecture-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Enforce architecture coverage regression floor
        run: |
          pytest -q -m "not integration and not media and not qmt and not slow" \
            --cov=engines.decision --cov=engines.memory --cov=engines.retrieval \
            --cov=agent --cov=app.skill_contract --cov=app.scheduler_service \
            --cov=app.model_providers --cov-report=term --cov-report=json:artifacts/architecture_coverage.json \
            --cov-fail-under=78
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-coverage
          path: artifacts/architecture_coverage.json

  retrieval-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Evaluate deterministic fixture corpus and ablations
        run: python -m scripts.run_retrieval_evaluation --output artifacts/retrieval_eval/current --ablation
      - name: Enforce retrieval regression gate
        run: python -m scripts.check_retrieval_regression --current artifacts/retrieval_eval/current/baseline/summary.json --baseline engines/retrieval/evaluation/datasets/baseline_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: artifacts/retrieval_eval/current

  three-repo-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock_agent
    steps:
      - uses: actions/checkout@v4
        with: {repository: Gakkiiiiiiiiiiiiii/stock_agent, ref: codex/subsystem-split, path: stock_agent}
      - uses: actions/checkout@v4
        with: {repository: Gakkiiiiiiiiiiiiii/stock_content, ref: codex/content-core-migration, path: stock_content}
      - uses: actions/checkout@v4
        with: {repository: Gakkiiiiiiiiiiiiii/stock_factor, ref: codex/factor-core-migration, path: stock_factor}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Start all bounded contexts
        run: docker compose -f docker-compose.integration.yml up -d --build
      - name: Wait for three-repository readiness
        run: docker compose -f docker-compose.integration.yml exec -T stock-agent-api python scripts/wait_three_repo_stack.py
      - name: Run three-repository business E2E
        run: docker compose -f docker-compose.integration.yml exec -T stock-agent-api python scripts/three_repo_business_e2e.py
      - name: Collect service logs
        if: always()
        run: docker compose -f docker-compose.integration.yml logs --no-color > artifacts/three_repo_compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: three-repo-logs, path: stock_agent/artifacts/three_repo_compose.log}
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
