name: unit-tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Collect
        run: |
          pytest --collect-only -q \
            -m "not integration and not media and not qmt and not slow"
      - name: Test
        run: |
          pytest -q \
            -m "not integration and not media and not qmt and not slow" \
            --cov=engines.factor \
            --cov=engines.market \
            --cov=engines.backtest \
            --cov-report=term-missing \
            --cov-fail-under=70
