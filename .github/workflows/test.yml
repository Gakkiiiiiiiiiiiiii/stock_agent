name: unit-tests

on:
  push:
  pull_request:
  # §14 真实 gate 不适合每个 PR 跑，改为手动 / nightly 触发
  workflow_dispatch:
  schedule:
    # nightly 03:00 CST（19:00 UTC 前一天）
    - cron: "0 19 * * *"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint skill contracts
        run: python scripts/check_skill_contracts.py
      - name: Check runtime artifacts are not tracked
        run: |
          if git ls-files | grep -E '(^|/)\.pytest_tmp[^/]*/|(^|/)\.coverage$|storage/runtime/.*\.(jsonl|log)$'; then
            echo "runtime artifacts are tracked"
            exit 1
          fi
      - name: Collect
        run: |
          pytest --collect-only -q \
            -m "not integration and not media and not qmt and not slow"
      - name: Test
        run: |
          pytest -q \
            -m "not integration and not media and not qmt and not slow" \
            --cov=engines.market \
            --cov=engines.backtest \
            --cov-report=term-missing \
            --cov-fail-under=70

  architecture-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Enforce architecture coverage regression floor
        run: |
          pytest -q -m "not integration and not media and not qmt and not slow" \
            --cov=engines.decision --cov=engines.memory --cov=engines.retrieval \
            --cov=agent --cov=app.skill_contract --cov=app.scheduler_service \
            --cov=app.model_providers --cov-report=term --cov-report=json:artifacts/architecture_coverage.json \
            --cov-fail-under=78
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-coverage
          path: artifacts/architecture_coverage.json

  retrieval-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[test]"
      - name: Evaluate deterministic fixture corpus and ablations
        run: python -m scripts.run_retrieval_evaluation --output artifacts/retrieval_eval/current --ablation
      - name: Enforce retrieval regression gate
        run: python -m scripts.check_retrieval_regression --current artifacts/retrieval_eval/current/baseline/summary.json --baseline engines/retrieval/evaluation/datasets/baseline_v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: artifacts/retrieval_eval/current

  full-stack-e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Start real service dependencies
        run: docker compose up -d postgres redis qdrant embedding reranker api vector_worker job_worker
      - name: Wait for API readiness
        run: python scripts/wait_full_stack.py --url http://127.0.0.1:8000/health/ready --timeout 180
      - name: Full stack integration tests
        run: |
          pip install -e ".[test]"
          RUN_FULL_STACK_E2E=1 pytest -q tests/integration/test_service_stack.py -m integration
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > artifacts/full_stack_compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: full-stack-logs, path: artifacts/full_stack_compose.log}
      - name: Stop stack
        if: always()
        run: docker compose down -v
