data_split:
  total_days: 500
  discovery_days: 250
  final_oos_days: 100
  max_warmup_days: 130
  final_oos_withheld_from_prompt: true

evaluation:
  horizon_days: 5
  min_coverage: 0.6
  min_rank_ic: 0.02
  min_icir: 0.3
  min_topk_excess_annual_return: 0.0

purged_walkforward:
  n_windows: 3
  embargo_days: 5
  min_window_pass_ratio: 0.6
  min_positive_rank_ic_ratio: 0.6
  min_oos_excess_return: 0.0
  min_rank_ic_floor: -0.02

neutralization:
  status: NOT_AVAILABLE
  required_exposures:
    - industry
    - log_market_cap
    - beta
    - liquidity

paper_trading:
  scoring_panel_days: 120
  mining_panel_days: 500
  scoring_buffer_days: 10
  remine_days: 5

high_position:
  min_pool_size: 10
  min_valid_count: 10
  min_quote_coverage: 0.8
  ret20_quantile: 0.9
  ret60_quantile: 0.9
  near_high_ratio: 0.95
  amount_ratio_quantile: 0.8
  prev_close_mismatch_threshold: 0.01
  max_mismatch_ratio: 0.05
