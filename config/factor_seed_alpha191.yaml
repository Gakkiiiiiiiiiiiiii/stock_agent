# Alpha191 风格因子种子库。
# 按 Alpha191 风格改写（非原式逐字复刻），仅作 few-shot 示例与判重基线。
# 每条均为纯日频 OHLCV/amount/vwap/turnover 可表达的 RPN 公式，
# 均可被 engines.factor.vm.StackVM 直接执行。
seeds:
- name: reversal_3d
  hypothesis: 3日反转：过去3日涨幅越高的股票短期越可能回落
  rpn: [close, close, ts_delay_3, div, neg, cs_rank]
- name: reversal_5d
  hypothesis: 5日反转：过去5日涨幅越高的股票短期越可能回落
  rpn: [close, close, ts_delay_5, div, neg, cs_rank]
- name: reversal_10d
  hypothesis: 10日反转：过去10日累计收益越高，短期均值回归压力越大
  rpn: [ret, ts_sum_10, neg, cs_rank]
- name: reversal_20d
  hypothesis: 20日反转：中短期累计涨幅过高后存在回撤压力
  rpn: [ret, ts_sum_20, neg, cs_rank]
- name: long_short_reversal_5_20
  hypothesis: 短长反转：5日收益相对20日收益越强，短期过热回落概率越高
  rpn: [ret, ts_mean_5, ret, ts_mean_20, sub, neg, cs_rank]
- name: intraday_return_reversal_5d
  hypothesis: 5日日内收益反转：近期收盘相对开盘偏强过多后容易回落
  rpn: [close, open, sub, open, div, ts_mean_5, neg, cs_rank]
- name: overnight_gap_reversal_5d
  hypothesis: 隔夜跳空反转：近期高开跳空较多的股票短期追涨风险更高
  rpn: [open, close, ts_delay_3, sub, close, ts_delay_3, div, ts_mean_5, neg, cs_rank]
- name: weighted_reversal_decay_10d
  hypothesis: 线性衰减加权反转：近期收益权重更高的10日加权收益反转
  rpn: [ret, decay_linear_10, neg, cs_rank]
- name: ret_rank_reversal_10d
  hypothesis: 收益时序排名反转：近期收益在自身10日窗口中越高，越可能短期回落
  rpn: [ret, ts_rank_10, neg, cs_rank]
- name: close_breakout_20d
  hypothesis: 20日突破动量：收盘价接近20日最高价，短期趋势可能延续
  rpn: [close, high, ts_max_20, div, cs_rank]
- name: close_breakdown_20d
  hypothesis: 20日低位修复：收盘价接近20日最低价后存在修复机会
  rpn: [close, low, ts_min_20, div, neg, cs_rank]
- name: days_since_high_20d
  hypothesis: 距离20日最高价的天数越短，临近新高动量越强
  rpn: [high, ts_argmax_20, neg, cs_rank]
- name: days_since_low_20d
  hypothesis: 距离20日最低价的天数越短，短期低位修复概率越高
  rpn: [low, ts_argmin_20, neg, cs_rank]
- name: bias_20d
  hypothesis: 20日乖离率：价格高于20日均线越多短期超买，反转概率越大
  rpn: [close, close, ts_mean_20, div, neg, cs_rank]
- name: ma_momentum_5_20
  hypothesis: 均线动量：5日均价相对20日均价越强，趋势延续越明显
  rpn: [close, ts_mean_5, close, ts_mean_20, div, cs_rank]
- name: ret_momentum_20d
  hypothesis: 20日收益动量：中短期收益持续为正的股票延续概率更高
  rpn: [ret, ts_mean_20, cs_rank]
- name: vwap_momentum_5d
  hypothesis: 均价动量：近5日成交均价上行的股票可能延续强势
  rpn: [vwap, ts_delta_5, cs_rank]
- name: price_volume_corr_10d
  hypothesis: 量价背离：近10日收盘价与成交量相关性越高，未来收益越差
  rpn: [close, volume, ts_corr_10, neg, cs_rank]
- name: return_volume_corr_10d
  hypothesis: 收益量能相关：收益与成交量高度同向代表拥挤交易，短期易反转
  rpn: [ret, volume, ts_corr_10, neg, cs_rank]
- name: amount_surge_20d
  hypothesis: 量能放大：当日成交额相对20日均额异常放大后短期动量衰减
  rpn: [amount, amount, ts_mean_20, div, neg, cs_rank]
- name: volume_surge_5_20
  hypothesis: 短期放量：5日均量相对20日均量越高，资金拥挤后更易回落
  rpn: [volume, ts_mean_5, volume, ts_mean_20, div, neg, cs_rank]
- name: volume_dryup_5_20
  hypothesis: 缩量稳定：5日均量相对20日均量越低，筹码稳定时收益更稳
  rpn: [volume, ts_mean_5, volume, ts_mean_20, div, cs_rank]
- name: amount_delta_5d
  hypothesis: 成交额变化：近5日成交额快速上升代表资金活跃
  rpn: [amount, ts_delta_5, cs_rank]
- name: amount_efficiency_10d
  hypothesis: 量能效率：单位成交额对应的10日收益越高，资金推动效率越强
  rpn: [ret, ts_mean_10, amount, ts_mean_10, div, cs_rank]
- name: price_volume_cov_10d
  hypothesis: 量价协方差：价格和成交量共同波动越强，短期交易拥挤越明显
  rpn: [close, volume, ts_cov_10, neg, cs_rank]
- name: volatility_ratio_5_20
  hypothesis: 波动率比值：5日波动相对20日波动放大，预示风险释放未完、收益偏弱
  rpn: [ret, ts_std_5, ret, ts_std_20, div, neg, cs_rank]
- name: volatility_contraction_20_60
  hypothesis: 波动率收敛：20日波动相对60日波动处于低位，风险调整后收益更稳
  rpn: [ret, ts_std_20, ret, ts_std_60, div, neg, cs_rank]
- name: low_return_volatility_20d
  hypothesis: 低收益波动：20日收益波动越低，短期表现越稳健
  rpn: [ret, ts_std_20, neg, cs_rank]
- name: amplitude_low_5d
  hypothesis: 低振幅：5日日内振幅越低，筹码越稳定
  rpn: [high, low, sub, close, div, ts_mean_5, neg, cs_rank]
- name: amplitude_stability_5d
  hypothesis: 振幅稳定：5日日内振幅波动越小，短期收益更稳
  rpn: [high, low, div, ts_std_5, neg, cs_rank]
- name: amplitude_ratio_5_20
  hypothesis: 振幅均值比：短期振幅相对长期振幅扩张后，短期过热反转
  rpn: [high, low, div, ts_mean_5, high, low, div, ts_mean_20, div, neg, cs_rank]
- name: price_range_width_20d
  hypothesis: 价格通道宽度：20日高低价区间越窄，波动收敛后可能蓄势
  rpn: [high, ts_max_20, low, ts_min_20, sub, close, ts_mean_20, div, neg, cs_rank]
- name: vwap_deviation
  hypothesis: 收盘价相对当日vwap的正偏离越大，尾盘追涨后短期越易回落
  rpn: [close, vwap, div, neg, cs_rank]
- name: vwap_deviation_stability_10d
  hypothesis: VWAP偏离稳定：收盘价相对VWAP偏离波动越小，定价越稳定
  rpn: [close, vwap, div, ts_std_10, neg, cs_rank]
- name: intraday_position
  hypothesis: 日内位置：收盘价在当日高低区间中的位置越高代表买盘越强
  rpn: [close, low, sub, high, low, sub, div, cs_rank]
- name: lower_shadow_support_5d
  hypothesis: 下影线支撑：近5日下影线比例越高，买方承接越强
  rpn: [open, close, min, low, sub, close, div, ts_mean_5, cs_rank]
- name: upper_shadow_pressure_5d
  hypothesis: 上影线压力：近5日上影线比例越高，短期抛压越明显
  rpn: [high, open, close, max, sub, close, div, ts_mean_5, neg, cs_rank]
- name: turnover_mean_20d
  hypothesis: 低换手溢价：20日均换手率越低，关注度低且筹码稳定，未来收益越好
  rpn: [turnover, ts_mean_20, neg, cs_rank]
- name: turnover_volatility_20d
  hypothesis: 换手稳定：20日换手率波动越低，交易结构越稳定
  rpn: [turnover, ts_std_20, neg, cs_rank]
- name: turnover_surge_5_20
  hypothesis: 换手放大：5日换手相对20日换手放大，短期拥挤交易可能回落
  rpn: [turnover, ts_mean_5, turnover, ts_mean_20, div, neg, cs_rank]
- name: high_volume_reversal_5d
  hypothesis: 放量反转：短期收益过强且放量时，追涨拥挤后反转概率更高
  rpn: [ret, ts_mean_5, volume, ts_mean_5, volume, ts_mean_20, div, mul, neg, cs_rank]
- name: low_volatility_reversal_5d
  hypothesis: 低波状态反转：低波动股票中的短期涨幅越高，均值回归压力越大
  rpn: [ret, ts_mean_5, ret, ts_std_20, neg, mul, neg, cs_rank]
- name: high_volatility_reversal_5d
  hypothesis: 高波状态反转：高波动股票短期上涨后更容易回撤
  rpn: [ret, ts_mean_5, ret, ts_std_20, mul, neg, cs_rank]
- name: volume_conditioned_momentum_10d
  hypothesis: 缩量动量：中期收益在缩量环境下更容易延续
  rpn: [ret, ts_mean_10, volume, ts_mean_5, volume, ts_mean_20, div, neg, mul, cs_rank]
