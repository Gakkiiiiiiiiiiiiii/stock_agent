image:
  repository: stock-agent
  tag: ci
  pullPolicy: Never
services:
  api:
    enabled: true
    replicas: 1
    image: {repository: stock-agent-api, tag: ci}
  worker:
    enabled: true
    replicas: 1
    image: {repository: stock-agent-worker, tag: ci}
  analysis:
    enabled: false
    image: {repository: stock-agent-analysis, tag: ci}
cronJobs:
  - {name: outcome-evaluation, schedule: "*/15 * * * *", command: ["python", "-m", "workers.job_worker", "--once"]}
env:
  FORMAL_READINESS_ENFORCED: "1"
  FORMAL_IDEMPOTENCY_REQUIRED: "1"
  DATABASE_URL: "sqlite:////tmp/financial_agent.db"
  STOCK_AGENT_DETERMINISTIC_FIXTURE: "1"
  STOCK_AGENT_OFFLINE_MODE: "0"
  AGENT_GIT_COMMIT: deterministic-fixture
