{{- range $job := .Values.cronJobs }}
apiVersion: batch/v1
kind: CronJob
metadata: {name: {{ include "stock-agent.fullname" $ }}-{{ $job.name }}}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: {{ $job.name }}
              {{- $image := default $.Values.image (dig "image" (dict) $.Values.services.worker) }}
              image: "{{ $image.repository }}:{{ $image.tag }}"
              imagePullPolicy: {{ default $.Values.image.pullPolicy $image.pullPolicy }}
              command: {{ toJson $job.command }}
              envFrom: [{configMapRef: {name: {{ include "stock-agent.fullname" $ }}-config}}]
              resources:
                requests: {{ toYaml $.Values.resources.requests | nindent 18 }}
                limits: {{ toYaml $.Values.resources.limits | nindent 18 }}
---
{{- end }}
