{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stock-agent.fullname" $ }}-{{ $name }}
  labels: {app.kubernetes.io/name: {{ include "stock-agent.name" $ }}, app.kubernetes.io/component: {{ $name | quote }}}
spec:
  replicas: {{ $service.replicas }}
  strategy:
    type: {{ if $service.singleton }}Recreate{{ else }}RollingUpdate{{ end }}
    {{- if not $service.singleton }}
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  selector: {matchLabels: {app.kubernetes.io/name: {{ include "stock-agent.name" $ }}, app.kubernetes.io/component: {{ $name | quote }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ include "stock-agent.name" $ }}, app.kubernetes.io/component: {{ $name | quote }}}}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: {{ toJson $service.command }}
          envFrom: [{configMapRef: {name: {{ include "stock-agent.fullname" $ }}-config}}]
          resources:
            {{- $resources := default $.Values.resources $service.resources }}
            requests: {{ toYaml $resources.requests | nindent 14 }}
            limits: {{ toYaml $resources.limits | nindent 14 }}
            {{- if $service.gpu }}
              nvidia.com/gpu: {{ $service.gpu }}
            {{- end }}
          {{- if eq (dig "probe" "type" "none" $service) "http" }}
          startupProbe: {httpGet: {path: {{ dig "probe" "path" "/health/live" $service }}, port: {{ dig "probe" "port" 8000 $service }}}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: {{ dig "probe" "path" "/health/ready" $service }}, port: {{ dig "probe" "port" 8000 $service }}}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: {{ dig "probe" "port" 8000 $service }}}, initialDelaySeconds: 15, periodSeconds: 20}
          {{- else if eq (dig "probe" "type" "none" $service) "exec" }}
          livenessProbe: {exec: {command: {{ toJson (dig "probe" "command" (list "true") $service) }}, initialDelaySeconds: 10, periodSeconds: 20}
          {{- end }}
          {{- if $service.port }}
          ports: [{containerPort: {{ $service.port }}}]
          {{- end }}
---
{{- end }}
{{- end }}
