# 四系统集成编排（收尾文档 §5 / 集成文档 §64）
#
# 依赖方向（只允许）：
#   stock_agent   --HTTP--> quant / stock_factor / stock_content
#   stock_factor  --HTTP--> quant / stock_content
#   stock_content --HTTP--> quant
#
# §5.1：禁止启动旧 Agent Market Data 服务（包括 8012 端口的旧事实源）；
# Market Data Authority 唯一 = quant。
# QMT 因 Windows Runtime 限制不进容器，通过 QMT Bridge 作为外部服务接入。
services:
  quant-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
    volumes:
      - quant-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant"]
      interval: 5s
      timeout: 5s
      retries: 20

  quant:
    build:
      context: ../../../quant
    environment:
      QUANT_V1_DATABASE_URL: postgresql+psycopg://quant:quant@quant-postgres:5432/quant
      QUANT_HISTORY_PARQUET: /data/history.parquet
      # §5.3：Integration/CI 使用 Fixture 历史数据与 Fixture PIT 元数据，不依赖真实 QMT。
      QUANT_MARKET_SOURCE: fixture
      QUANT_SNAPSHOT_DIR: /data/market_snapshots
    volumes:
      - quant-data:/data
    ports:
      - "${QUANT_PORT:-8011}:8011"
    depends_on:
      quant-postgres:
        condition: service_healthy

  content-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_content
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - content-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_content"]
      interval: 5s
      timeout: 5s
      retries: 20

  stock-content:
    build:
      context: ../../../stock_content
    environment:
      CONTENT_DATABASE_URL: postgresql+psycopg://postgres:postgres@content-postgres:5432/stock_content
      # §5.5：Content -> Quant 事实验证通道
      QUANT_SERVICE_URL: http://quant:8011
      CONTENT_EXTERNAL_FACT_PROVIDER: quant
    ports:
      - "${CONTENT_PORT:-8100}:8100"
    depends_on:
      content-postgres:
        condition: service_healthy
      quant:
        condition: service_started

  factor-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_factor
      POSTGRES_USER: factor
      POSTGRES_PASSWORD: factor
    volumes:
      - factor-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factor -d stock_factor"]
      interval: 5s
      timeout: 5s
      retries: 20

  stock-factor:
    build:
      context: ../../../stock_factor
    environment:
      # §5.4：Factor 只依赖 quant 市场数据；禁止旧 Agent Market Data 地址
      FACTOR_DATABASE_URL: postgresql+psycopg://factor:factor@factor-postgres:5432/stock_factor
      MARKET_DATA_SERVICE_URL: http://quant:8011
      QUANT_SERVICE_URL: http://quant:8011
      CONTENT_SERVICE_URL: http://stock-content:8100
      # §26：Paper Authority = quant trading.v1
      FACTOR_PAPER_AUTHORITY: quant
    ports:
      - "${FACTOR_PORT:-8200}:8200"
    depends_on:
      factor-postgres:
        condition: service_healthy
      quant:
        condition: service_started
      stock-content:
        condition: service_started

  agent-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_agent_pass}
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-financial_agent}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant-data:/qdrant/storage

  stock-agent:
    build:
      context: ../../..
    env_file:
      - path: ../../../.env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change_me_agent_pass}@agent-postgres:5432/${POSTGRES_DB:-financial_agent}
      # §5.6：Agent 只通过 HTTP 契约依赖其他仓库
      CONTENT_SERVICE_URL: http://stock-content:8100
      FACTOR_SERVICE_URL: http://stock-factor:8200
      QUANT_SERVICE_URL: http://quant:8011
      MARKET_DATA_SERVICE_URL: http://quant:8011
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${AGENT_PORT:-8000}:8000"
    depends_on:
      agent-postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      quant:
        condition: service_started
      stock-content:
        condition: service_started
      stock-factor:
        condition: service_started

volumes:
  quant-postgres:
  content-postgres:
  factor-postgres:
  agent-postgres:
  qdrant-data:
  quant-data:
