# Three-repository integration topology.  Each bounded context owns its DB;
# calls between them use the versioned HTTP contracts only.
services:
  agent-postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: financial_agent, POSTGRES_USER: agent, POSTGRES_PASSWORD: agent }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U agent -d financial_agent"], interval: 5s, timeout: 5s, retries: 20 }
  agent-redis:
    image: redis:7-alpine
  agent-qdrant:
    image: qdrant/qdrant:v1.12.6
  embedding:
    build: { context: ., dockerfile: Dockerfile.core }
    command: uvicorn workers.embedding_api:app --host 0.0.0.0 --port 8001
    environment: { EMBEDDING_PROVIDER: hash, EMBEDDING_DIMENSION: 64 }
  reranker:
    build: { context: ., dockerfile: Dockerfile.core }
    command: uvicorn workers.reranker_api:app --host 0.0.0.0 --port 8010
    environment: { RERANKER_PROVIDER: lexical }
  market-data-service:
    build: { context: ., dockerfile: Dockerfile.core }
    command: uvicorn services.market_data_api:app --host 0.0.0.0 --port 8012
  stock-content-api:
    build: { context: ../stock_content }
    environment:
      CONTENT_DATABASE_URL: postgresql://content:content@content-postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://content-qdrant:6333
    depends_on: [content-postgres, content-qdrant]
  stock-content-worker:
    build: { context: ../stock_content }
    command: stock-content-worker
    environment:
      CONTENT_DATABASE_URL: postgresql://content:content@content-postgres:5432/stock_content
      CONTENT_QDRANT_URL: http://content-qdrant:6333
    depends_on: [content-postgres, content-qdrant]
  content-postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: stock_content, POSTGRES_USER: content, POSTGRES_PASSWORD: content }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U content -d stock_content"], interval: 5s, timeout: 5s, retries: 20 }
  content-qdrant:
    image: qdrant/qdrant:v1.12.6
  stock-factor-api:
    build: { context: ../stock_factor }
    environment:
      FACTOR_DATABASE_URL: postgresql://factor:factor@factor-postgres:5432/stock_factor
      MARKET_DATA_SERVICE_URL: http://market-data-service:8012
      CONTENT_SERVICE_URL: http://stock-content-api:8100
    depends_on: [factor-postgres, market-data-service, stock-content-api]
  stock-factor-worker:
    build: { context: ../stock_factor }
    command: stock-factor-worker
    environment:
      FACTOR_DATABASE_URL: postgresql://factor:factor@factor-postgres:5432/stock_factor
      MARKET_DATA_SERVICE_URL: http://market-data-service:8012
      CONTENT_SERVICE_URL: http://stock-content-api:8100
    depends_on: [factor-postgres, market-data-service, stock-content-api]
  factor-postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: stock_factor, POSTGRES_USER: factor, POSTGRES_PASSWORD: factor }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U factor -d stock_factor"], interval: 5s, timeout: 5s, retries: 20 }
  stock-agent-api:
    build: { context: ., dockerfile: Dockerfile.core }
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://agent:agent@agent-postgres:5432/financial_agent
      REDIS_URL: redis://agent-redis:6379/0
      QDRANT_URL: http://agent-qdrant:6333
      EMBEDDING_BASE_URL: http://embedding:8001/v1
      RERANKER_URL: http://reranker:8010
      CONTENT_SERVICE_URL: http://stock-content-api:8100
      FACTOR_SERVICE_URL: http://stock-factor-api:8200
    depends_on: [agent-postgres, agent-redis, agent-qdrant, embedding, reranker, stock-content-api, stock-factor-api]
