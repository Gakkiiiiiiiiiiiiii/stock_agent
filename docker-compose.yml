services:
  postgres:
    image: postgres:16
    container_name: financial_agent_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_agent_pass}
      POSTGRES_DB: ${POSTGRES_DB:-financial_agent}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./storage/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-financial_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: stock-agent-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  redis:
    image: redis:7
    container_name: financial_agent_redis
    command: ["sh", "-lc", "redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis_pass}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "sh", "-lc", "redis-cli $${REDIS_PASSWORD:+-a $$REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  embedding:
    build: .
    image: stock-agent-embedding:0.1.0
    container_name: stock-agent-embedding
    command: uvicorn workers.embedding_api:app --host 0.0.0.0 --port 8001
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_PROVIDER: ${EMBEDDING_SERVICE_PROVIDER:-sentence_transformers}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./app:/app/app
      - ./config:/app/config
      - ./engines:/app/engines
      - ./financial_agent:/app/financial_agent
      - ./workers:/app/workers
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  reranker:
    build: .
    image: stock-agent-reranker:0.1.0
    container_name: stock-agent-reranker
    command: uvicorn workers.reranker_api:app --host 0.0.0.0 --port 8010
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change_me_agent_pass}@postgres:5432/${POSTGRES_DB:-financial_agent}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_pass}@redis:6379/0
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-sentence_transformers}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - ./app:/app/app
      - ./agent:/app/agent
      - ./config:/app/config
      - ./engines:/app/engines
      - ./financial_agent:/app/financial_agent
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./workers:/app/workers
      - ./storage:/app/storage
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: stock-agent-api:0.1.0
    container_name: stock-agent-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change_me_agent_pass}@postgres:5432/${POSTGRES_DB:-financial_agent}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_pass}@redis:6379/0
      RERANKER_URL: http://reranker:8010
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8001/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      QMT_BRIDGE_BASE_URL: ${QMT_BRIDGE_BASE_URL:-http://host.docker.internal:18080}
      VIDEO_EXTERNAL_FACT_VERIFICATION: ${VIDEO_EXTERNAL_FACT_VERIFICATION:-1}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-large-v3}
      ASR_DEVICE: ${ASR_DEVICE:-cuda}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      ASR_USE_BATCHED: "${ASR_USE_BATCHED:-true}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-4}"
      ASR_BEAM_SIZE: "${ASR_BEAM_SIZE:-5}"
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
      VIDEO_OCR_DEVICE: gpu:0
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./app:/app/app
      - ./agent:/app/agent
      - ./config:/app/config
      - ./engines:/app/engines
      - ./financial_agent:/app/financial_agent
      - ./knowledge_base:/app/knowledge_base
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./skills:/app/skills
      - ./storage:/app/storage
      - ./workers:/app/workers
      - ./xiaoe_hls_poc:/app/xiaoe_hls_poc
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy

  vector_worker:
    build: .
    image: stock-agent-vector-worker:0.1.0
    container_name: stock-agent-vector-worker
    command: python workers/vector_index_worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change_me_agent_pass}@postgres:5432/${POSTGRES_DB:-financial_agent}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_pass}@redis:6379/0
      RERANKER_URL: http://reranker:8010
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8001/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      QMT_BRIDGE_BASE_URL: ${QMT_BRIDGE_BASE_URL:-http://host.docker.internal:18080}
      VIDEO_EXTERNAL_FACT_VERIFICATION: ${VIDEO_EXTERNAL_FACT_VERIFICATION:-1}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-large-v3}
      ASR_DEVICE: ${ASR_DEVICE:-cuda}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      ASR_USE_BATCHED: "${ASR_USE_BATCHED:-true}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-4}"
      ASR_BEAM_SIZE: "${ASR_BEAM_SIZE:-5}"
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
      HF_ENDPOINT: https://hf-mirror.com
      HF_HUB_DISABLE_XET: "1"
      FFMPEG_BIN: /usr/bin/ffmpeg
      FFPROBE_BIN: /usr/bin/ffprobe
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./app:/app/app
      - ./agent:/app/agent
      - ./config:/app/config
      - ./engines:/app/engines
      - ./financial_agent:/app/financial_agent
      - ./knowledge_base:/app/knowledge_base
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./skills:/app/skills
      - ./storage:/app/storage
      - ./workers:/app/workers
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy

  job_worker:
    build: .
    image: stock-agent-job-worker:0.1.0
    container_name: stock-agent-job-worker
    command: python workers/job_worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-change_me_agent_pass}@postgres:5432/${POSTGRES_DB:-financial_agent}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD:-change_me_redis_pass}@redis:6379/0
      RERANKER_URL: http://reranker:8010
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:8001/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      QMT_BRIDGE_BASE_URL: ${QMT_BRIDGE_BASE_URL:-http://host.docker.internal:18080}
      VIDEO_EXTERNAL_FACT_VERIFICATION: ${VIDEO_EXTERNAL_FACT_VERIFICATION:-1}
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-large-v3}
      ASR_DEVICE: ${ASR_DEVICE:-cuda}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-float16}
      ASR_USE_BATCHED: "${ASR_USE_BATCHED:-true}"
      ASR_BATCH_SIZE: "${ASR_BATCH_SIZE:-4}"
      ASR_BEAM_SIZE: "${ASR_BEAM_SIZE:-5}"
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
    volumes:
      - ./app:/app/app
      - ./agent:/app/agent
      - ./config:/app/config
      - ./engines:/app/engines
      - ./financial_agent:/app/financial_agent
      - ./knowledge_base:/app/knowledge_base
      - ./mcp_servers:/app/mcp_servers
      - ./scripts:/app/scripts
      - ./skills:/app/skills
      - ./storage:/app/storage
      - ./workers:/app/workers
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./README.md:/app/README.md:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  hf_cache:
