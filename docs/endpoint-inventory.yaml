version: 1
endpoints:
  - {path: /api/v2/decisions, method: POST, authority: FORMAL, status: active}
  - {path: /api/v2/analysis/stock, method: POST, authority: ANALYSIS_ONLY, status: active}
  - {path: /api/v2/analysis/theme, method: POST, authority: ANALYSIS_ONLY, status: active}
  - {path: /api/v1/decisions, method: POST, authority: COMPATIBILITY_READ_ONLY, status: 410, replacement: /api/v2/decisions}
  - {path: /api/v1/analyze/stock, method: POST, authority: ANALYSIS_ONLY, status: deprecated, replacement: /api/v2/analysis/stock}
  - {path: /api/v1/analyze/theme, method: POST, authority: ANALYSIS_ONLY, status: deprecated, replacement: /api/v2/analysis/theme}
