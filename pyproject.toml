[project]
name = "stock-agent"
version = "0.1.0"
description = "Financial analysis agent MVP with technical factors, knowledge base, and API orchestration."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.67",
  "fastapi>=0.111",
  "filelock>=3.15",
  "httpx>=0.27",
  "pandas>=2.2",
  "psycopg[binary]>=3.2",
  "qrcode>=8.2",
  "qdrant-client>=1.11",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "fastapi>=0.111",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "filelock>=3.15",
  "yt-dlp>=2025.1.26",
]
media = [
  "faster-whisper>=1.1",
  "opencc-python-reimplemented>=0.1.7",
  "paddleocr>=3.3.1",
  "yt-dlp>=2025.1.26",
]
ml = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.2",
  "filelock>=3.15",
  "faster-whisper>=1.1",
  "opencc-python-reimplemented>=0.1.7",
  "paddleocr>=3.3.1",
  "sentence-transformers>=3.0",
  "yt-dlp>=2025.1.26",
]

[tool.setuptools.packages.find]
include = ["agent*", "app*", "engines*", "financial_agent*", "mcp_servers*", "storage*", "workers*"]
exclude = ["artitect*", "config*", "docs*", "knowledge_base*", "skills*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests requiring external services or heavyweight model runtimes",
  "media: OCR/ASR/video runtime tests",
  "qmt: real QMT bridge tests",
  "slow: long-running tests",
]
