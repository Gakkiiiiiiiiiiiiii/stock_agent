[project]
name = "stock-agent"
version = "0.1.0"
description = "Financial analysis agent MVP with technical factors, knowledge base, and API orchestration."
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
core = [
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
]
api = [
  "fastapi>=0.111",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "uvicorn>=0.30",
]
worker = [
  "filelock>=3.15",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
]
analysis = [
  "anthropic>=0.67",
  "pandas>=2.2",
  "qdrant-client>=1.11",
  "rich>=13.0",
  "typer>=0.9",
]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "fastapi>=0.111",
  "httpx>=0.27",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "types-PyYAML>=6.0",
  "pyyaml>=6.0",
  "qdrant-client>=1.11",
  "redis>=5.0",
  "psycopg[binary]>=3.2",
  "filelock>=3.15",
  "mypy>=1.11",
]
ml = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.2",
  "filelock>=3.15",
  "mypy>=1.11",
  "sentence-transformers>=3.0",
]

[tool.mypy]
python_version = "3.11"
files = ["app/domain", "app/application"]
follow_imports = "skip"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.setuptools.packages.find]
include = ["agent*", "app*", "clients*", "contracts*", "engines*", "evals*", "financial_agent*", "services*", "storage*", "workers*"]
exclude = ["artitect*", "config*", "docs*", "knowledge_base*", "skills*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests requiring external services or heavyweight model runtimes",
  "media: OCR/ASR/video runtime tests",
  "qmt: real QMT bridge tests",
  "slow: long-running tests",
]
