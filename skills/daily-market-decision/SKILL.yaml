version: 3
slug: daily-market-decision
name: 每日市场决策
required_evidence:
  - MARKET_SNAPSHOT
  - MARKET_REGIME
  - SECTOR_STRENGTH
  - PORTFOLIO_POSITION
  - PORTFOLIO_RISK
required_specialists:
  - MARKET
  - RESEARCH
  - TECHNICAL
  - FACTOR
  - PORTFOLIO
  - RISK
governance:
  require_risk: true
  require_policy: true
freshness:
  market:
    require_same_trading_day: true
    max_age_minutes: 30
execution:
  max_tool_rounds: 12
  require_fresh_market_data: true
  require_memory_lookup: true
  require_regime: true
output:
  proposal_schema: investment-proposal.v2
  required_sections:
    - 市场环境
    - 风格判断
    - 今日强主题
    - 候选标的
    - 仓位建议
    - 明日观察点
